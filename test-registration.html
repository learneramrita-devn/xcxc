<!DOCTYPE html>
<html>
<head>
    <title>Test Registration</title>
</head>
<body>
    <h1>Test Registration API</h1>
    <button onclick="testRegistration()">Test Registration</button>
    <pre id="result"></pre>

    <script>
        async function testRegistration() {
            const payload = {
                tenant: { tenantId: 1 },
                externalUserId: "EXT-USR-" + Date.now(),
                role: "AGENT",
                name: "TEST USER",
                email: "test" + Date.now() + "@example.com",
                mobileNumber: "9999999999",
                passwordHash: "Test@123",
                agentType: "AGENCY",
                status: "ENABLED",
                userSource: "WEB",
                userAdditionalInfo: {
                    rc: "",
                    rfb: "SYSTEM",
                    grade: "A",
                    ft: "PRIVATE",
                    bal: [{
                        bn: "",
                        accNo: "",
                        ifsc: "",
                        cmts: "",
                        ahn: "TEST USER",
                        vl: "PRIMARY",
                        bt: "SAVINGS"
                    }],
                    ael: [],
                    cncd: "IN",
                    curr: "INR"
                },
                userProfileInfo: {
                    gdr: "MALE",
                    dob: "1995-01-01",
                    zip: "110001",
                    fn: "TEST USER",
                    zd: "Delhi",
                    co: "",
                    pi: "",
                    tz: "Asia/Kolkata",
                    language: "EN",
                    lurl: ""
                },
                userDocuments: {
                    pan: "ABCDE1234F",
                    adr: "123412341234"
                },
                addressInfo: {
                    address: "Test Address",
                    pinCode: "110001",
                    cityName: "Delhi",
                    state: "Delhi",
                    country: "India"
                },
                contactPersonInfo: {
                    name: "TEST USER",
                    mobileNumber: "9999999999",
                    email: "test@example.com"
                },
                businessInfo: {
                    bstp: "TRAVEL",
                    bsn: "Test Agency",
                    rflcd: ""
                },
                securityInfo: {
                    ip: "",
                    di: navigator.userAgent,
                    gl: ""
                },
                kycInfo: {
                    ks: "PENDING",
                    ksa: new Date().toISOString()
                },
                lifeCycleInfo: {
                    iat: new Date().toISOString(),
                    aat: null,
                    sat: null,
                    ovat: null
                }
            };

            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Testing...\n\n';

            try {
                // Test 1: /api/v1/users/create
                resultDiv.textContent += '=== Testing /api/v1/users/create ===\n';
                const response1 = await fetch('http://13.126.207.62:8080/api/v1/users/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data1 = await response1.json();
                resultDiv.textContent += 'Status: ' + response1.status + '\n';
                resultDiv.textContent += 'Response: ' + JSON.stringify(data1, null, 2) + '\n\n';

                // Test 2: /ums/v1/users/create
                resultDiv.textContent += '=== Testing /ums/v1/users/create ===\n';
                const response2 = await fetch('http://13.126.207.62:8080/ums/v1/users/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data2 = await response2.json();
                resultDiv.textContent += 'Status: ' + response2.status + '\n';
                resultDiv.textContent += 'Response: ' + JSON.stringify(data2, null, 2) + '\n';

            } catch (error) {
                resultDiv.textContent += 'Error: ' + error.message + '\n';
                console.error(error);
            }
        }
    </script>
</body>
</html>
